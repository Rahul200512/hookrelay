name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build · test · coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B --no-transfer-progress verify
      - name: Coverage summary
        if: always()
        run: |
          f=target/site/jacoco/jacoco.csv
          if [ -f "$f" ]; then
            awk -F, 'NR>1 {m+=$4; c+=$5} END {printf "line coverage: %.1f%% (%d/%d)\n", 100*c/(m+c), c, m+c}' "$f"
          fi

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
