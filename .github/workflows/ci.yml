name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build · test · coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B --no-transfer-progress verify
      - name: Coverage summary
        if: always()
        run: |
          f=target/site/jacoco/jacoco.csv
          if [ -f "$f" ]; then
            awk -F, 'NR>1 {m+=$4; c+=$5} END {printf "line coverage: %.1f%% (%d/%d)\n", 100*c/(m+c), c, m+c}' "$f"
          fi

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The official action downloads a release binary and answers 504 often enough
      # to redden a green build. The image is already on the runner's registry path.
      - name: Scan history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --verbose --no-banner
