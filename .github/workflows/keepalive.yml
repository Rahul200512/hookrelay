name: Keep warm

# Render's free tier sleeps a service after 15 idle minutes and takes about a minute
# to wake. A health check every 10 minutes keeps the demo answering instantly. This
# goes away if v3's native image makes the cold start not worth avoiding.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - env:
          URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$URL" ]; then echo "APP_URL variable not set"; exit 0; fi
          curl -fsS --max-time 90 "$URL/actuator/health" && echo
