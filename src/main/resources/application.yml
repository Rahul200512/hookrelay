spring:
  application:
    name: hookrelay
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hookrelay}
    username: ${DATABASE_USERNAME:hookrelay}
    password: ${DATABASE_PASSWORD:hookrelay}
    hikari:
      # Neon's free tier is happiest with a small pool; the app is I/O-bound on
      # receivers, not on the database.
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

hookrelay:
  # Render injects RENDER_EXTERNAL_URL; anywhere else, set APP_PUBLIC_URL.
  public-url: ${APP_PUBLIC_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
  delivery:
    poll-interval: 1s
    batch-size: 50
    max-in-flight: 200
    per-endpoint-in-flight: 4
    lease: 60s
    # The API and the worker are the same process today. This switch is what would
    # separate them: run API nodes with it false, worker nodes with it true.
    poller-enabled: true
    threads:
      # VIRTUAL or PLATFORM. Delivery is almost entirely waiting on someone else's
      # server, which is the workload virtual threads exist for — see the benchmark
      # in the README rather than taking that on faith.
      model: VIRTUAL
      platform-pool-size: 16
    # A paused endpoint is let back into rotation after this long. The probe is the
    # next real event: if the receiver is still down it simply pauses again.
    pause-cooldown: 15m
    connect-timeout: 3s
    read-timeout: 10s
    pause-after-consecutive-failures: 50
  security:
    # Only ever true in dev/test: lets endpoints point at localhost.
    allow-private-targets: false
    events-per-minute-per-tenant: 120
    # Base64 of 32 bytes: openssl rand -base64 32. No default on purpose — the service
    # refuses to start without it rather than store signing secrets in the clear.
    encryption-key: ${APP_ENCRYPTION_KEY:}
    # A rotated secret keeps signing alongside its replacement for this long, so a
    # receiver can be updated without dropping a delivery in between.
    secret-overlap: 24h
    demo-retention: 7d
    signups-per-hour-per-ip: 5

server:
  # Render tells the container which port to bind through PORT.
  port: ${PORT:8080}
  shutdown: graceful
  # Render terminates TLS and forwards; trust X-Forwarded-* so remote IPs are real.
  forward-headers-strategy: native
